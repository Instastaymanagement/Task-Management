name: Slack tasks to monday.com

on:
  schedule:
    # Every 5 minutes (GitHub may start scheduled runs a few minutes late when busy)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log the tasks found without creating them on monday.com"
        type: boolean
        default: true
      lookback_hours:
        description: "Re-read this many hours of messages (leave empty to continue from the last run)"
        type: string
        default: ""

# Never run two scans at once; a queued run waits for the current one.
concurrency:
  group: slack-tasks
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # to delete old checkpoint caches

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests

      # The last-run checkpoint lives in the Actions cache between runs.
      - name: Restore checkpoint
        uses: actions/cache/restore@v5
        with:
          path: state
          key: slack-state-${{ github.run_id }}
          restore-keys: slack-state-

      - name: Find tasks in Slack, guest conversations and Quo
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          HOSPITABLE_API_TOKEN: ${{ secrets.HOSPITABLE_API_TOKEN }}
          QUO_API_KEY: ${{ secrets.QUO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          # Scheduled runs create tasks for real; manual runs default to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
          STATE_FILE: state/slack_state.json
          FIRST_RUN_HOURS: "2"
          DEFAULT_COUNTRY: Canada
          # Which Quo number files tasks on which board, e.g. "+15195550100=Canada,+16175550100=USA"
          QUO_NUMBERS: "+12267813731=Canada,+18573538919=USA"
          # Job candidates' texts are handled by the HR-Interview repo, not turned into tasks
          CANDIDATE_BOARD: "18435820027"
          SLACK_CHANNELS: ""  # e.g. "maintenance,cleaning-ops,team" to limit the scan
        run: python slack_tasks.py

      - name: Save checkpoint
        if: success() && hashFiles('state/slack_state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: state
          key: slack-state-${{ github.run_id }}

      - name: Delete older checkpoints
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key slack-state- --limit 100 --json key --jq '.[].key' |
            grep -v "^slack-state-${{ github.run_id }}$" |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
